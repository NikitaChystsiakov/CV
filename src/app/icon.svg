<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Знак проекта: изометрическая клетка городка, по верхней грани которой
       проходит дорога маршрута. Один цвет: акцент светлой темы (токен accent в
       globals.css), борта тем же цветом с прозрачностью. У фавикона нет доступа
       к CSS-переменным страницы, поэтому это единственное место, где значение
       токена вписано литералом. Дорога сплошная: пунктир на 16px читается как
       рваный край. -->
  <defs>
    <mask id="road">
      <rect width="32" height="32" fill="#fff"/>
      <line x1="2" y1="4" x2="30" y2="20" stroke="#000" stroke-width="5"/>
    </mask>
  </defs>
  <g fill="#0f8f84">
    <path d="M2 12 16 20V28L2 20Z" opacity=".72"/>
    <path d="M16 20 30 12V20L16 28Z" opacity=".5"/>
    <path d="M16 4 30 12 16 20 2 12Z" mask="url(#road)"/>
  </g>
</svg>
