<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120" shape-rendering="geometricPrecision">
  <!-- Урна: временная заглушка, нарисованная кодом по просьбе владельца
       (22.09.2026). Истинная изометрия 30° (tg 30° = 0,57735), плоские заливки,
       тень не запечена — её рисует код своим токеном. Подложка-газон — часть
       ассета, как у остальных объектов набора.

       Корпус низкий и широкий: высокий и узкий силуэт читался тумбой, а не
       урной. Цвет приглушённый серо-зелёный, а не бирюзовый: бирюза в проекте
       единственный акцент и помечает интерактив, а урна — фоновый предмет,
       который не должен тянуть на себя взгляд.

       Придёт настоящий ассет от владельца — этот файл удаляется. -->

  <!-- Подложка: кусок газона, центр верхней грани — точка опоры (48; 87,29) -->
  <path d="M0,87.29 L48,115 L48,120 L0,92.29 Z" fill="#5e8147"/>
  <path d="M48,115 L96,87.29 L96,92.29 L48,120 Z" fill="#446430"/>
  <path d="M0,87.29 L48,59.57 L96,87.29 L48,115 Z" fill="#7aa85d"/>
  <path d="M0,87.29 L48,115 L96,87.29 L96,85.09 L48,112.8 L0,85.09 Z" fill="#8cb86f"/>

  <!-- Цоколь: плита под корпусом, полуширина 25, толщина 4 -->
  <path d="M23,83.29 L48,97.72 L48,101.72 L23,87.29 Z" fill="#a89f8b"/>
  <path d="M48,97.72 L73,83.29 L73,87.29 L48,101.72 Z" fill="#837b6b"/>
  <path d="M23,83.29 L48,68.86 L73,83.29 L48,97.72 Z" fill="#c9bfa9"/>

  <!-- Корпус: усечённая призма, верх шире низа (60 против 46), высота 44.
       Свет слева: левая грань светлее правой -->
  <path d="M18,43.29 L48,60.61 L48,100.57 L25,87.29 Z" fill="#4c6659"/>
  <path d="M48,60.61 L78,43.29 L71,87.29 L48,100.57 Z" fill="#33463d"/>
  <!-- Блик на ближнем ребре — приём из фонаря владельца -->
  <path d="M48,60.61 L48,100.57 L45.4,99.07 L45.4,59.11 Z" fill="#5d7a6b"/>

  <!-- Крышка: нависает над корпусом (полуширина 33), бортик 4 -->
  <path d="M15,39.29 L48,58.34 L48,62.34 L15,43.29 Z" fill="#a89f8b"/>
  <path d="M48,58.34 L81,39.29 L81,43.29 L48,62.34 Z" fill="#837b6b"/>
  <path d="M15,39.29 L48,20.24 L81,39.29 L48,58.34 Z" fill="#c9bfa9"/>
  <!-- Жерло: главный признак урны на мелком масштабе -->
  <path d="M32,39.29 L48,30.05 L64,39.29 L48,48.53 Z" fill="#20302a"/>
</svg>
